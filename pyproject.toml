[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "systemone-lite"
version = "0.1.0"
description = "Jev-compatible System One API via lightweight causal LM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "httpx>=0.27.0",
  "torch>=2.4.0",
  "transformers>=4.46.0",
  "accelerate>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]
viral = [
  "chess>=1.10",
  "Pillow>=10.0",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "numpy>=1.26",
]
chess = [
  "chess>=1.10",
]
train = [
  "wandb>=0.18.0",
]

[project.scripts]
systemone-lite = "systemone_lite.api:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
